<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Central Ledger / Balance Motif -->
  <!-- Top decorative bar -->
  <rect x="136" y="110" width="240" height="20" rx="10" fill="url(#gold)" />
  <circle cx="256" cy="120" r="14" fill="#f8fafc" />
  
  <!-- Left pan (Je dois - subtle amber/rose) -->
  <path d="M 176 120 L 140 220" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <path d="M 216 120 L 180 220" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <path d="M 120 220 Q 160 270 200 220 Z" fill="#f59e0b" fill-opacity="0.85" />

  <!-- Right pan (On me doit - emerald) -->
  <path d="M 296 120 L 332 200" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <path d="M 336 120 L 372 200" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />
  <path d="M 312 200 Q 352 250 392 200 Z" fill="url(#accent)" />

  <!-- Pillar -->
  <rect x="246" y="120" width="20" height="230" rx="10" fill="#64748b" />
  <path d="M 196 350 L 316 350 L 336 385 L 176 385 Z" fill="#334155" />
  
  <!-- Currencies pill badge: FC & $ -->
  <rect x="166" y="405" width="180" height="46" rx="23" fill="#1e293b" stroke="#475569" stroke-width="3" />
  <text x="256" y="437" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="2">
    FC · $ USD
  </text>
</svg>
